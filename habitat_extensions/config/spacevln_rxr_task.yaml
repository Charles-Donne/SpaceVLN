SEED: 0
ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
SIMULATOR:
  ACTION_SPACE_CONFIG: v1
  AGENT_0:
    SENSORS: [RGB_SENSOR, DEPTH_SENSOR]
    HEIGHT: 0.88
    RADIUS: 0.1
  FORWARD_STEP_SIZE: 0.25
  TURN_ANGLE: 30
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
    TYPE: HabitatSimRGBSensor
  DEPTH_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    MIN_DEPTH: 0.5
    MAX_DEPTH: 5.0
    POSITION: [0, 0.88, 0]
  TYPE:
    Sim-v1
TASK:
  TYPE: VLN-v0
  SUCCESS_DISTANCE: &success_distance 3.0
  SENSORS: [
    INSTRUCTION_SENSOR,
    SENSOR_POSE_SENSOR,
    LLM_SENSOR,
    POSITION_SENSOR,
    HEADING_SENSOR
  ]
  INSTRUCTION_SENSOR_UUID: instruction
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT, LOOK_UP, LOOK_DOWN]
  MEASUREMENTS: [
    DISTANCE_TO_GOAL,
    SUCCESS,
    SPL,
    NDTW,
    PATH_LENGTH,
    ORACLE_SUCCESS,
    ORACLE_NAVIGATION_ERROR,
    ORACLE_SPL,
    STEPS_TAKEN,
    POSITION
  ]
  SUCCESS:
    SUCCESS_DISTANCE: *success_distance
  SPL:
    SUCCESS_DISTANCE: *success_distance
  NDTW:
    SUCCESS_DISTANCE: *success_distance
    GT_PATH: ../data/datasets/RxR_VLNCE_v0/{split}/{split}_{role}_gt.json.gz
  SDTW:
    SUCCESS_DISTANCE: *success_distance
    GT_PATH: ../data/datasets/RxR_VLNCE_v0/{split}/{split}_{role}_gt.json.gz
  ORACLE_SUCCESS:
    SUCCESS_DISTANCE: *success_distance
  ORACLE_NAVIGATION_ERROR:
    SUCCESS_DISTANCE: *success_distance
  ORACLE_SPL:
    SUCCESS_DISTANCE: *success_distance
DATASET:
  TYPE: RxR-VLN-CE-v1
  SPLIT: val_unseen
  DATA_PATH: ../data/datasets/RxR_VLNCE_v0/{split}/{split}_{role}.json.gz
  SCENES_DIR: ../data/scene_datasets
  ROLES: ["guide", "follower"]
  LANGUAGES: ["en-US"]
