# Default SpaceVLN real-robot configuration.
# Tuned for Intel RealSense D435i plus a low-level odometry / orientation stream.

ros_version: ros2
node_name: spacevln_real_d435i
pose_source: odometry
capture_mode: stream
# RealSense depth headers can occasionally be stale or use a different clock.
# In auto mode, real-robot sync falls back to receive time when a header stamp
# is far from wall time; this does not affect simulation.
timestamp_policy: auto
max_header_receive_time_delta_s: 2.0
use_imu_orientation: false
require_fresh_frame_after_action: true
action_status_required: true
observation_timeout_s: 3.0
action_timeout_s: 20.0
sync_tolerance_s: 0.75

lookaround:
  sample_count: 8
  angle_step_deg: 45.0

mapping:
  disable_depth_map_update: false
  # Fuse the synchronized depth frame with its immediate neighbors.
  depth_fusion_frames: 3
  # Unknown depth cells do not vote. Observed obstacle/free cells update
  # bounded evidence so later real observations can correct the local map.
  selective_dynamic_obstacle_update: true
  obstacle_evidence_threshold: 0.55
  obstacle_evidence_max_observations: 8

buffers:
  image_queue_size: 8
  pose_queue_size: 256

camera:
  name: realsense-d435i
  rgb_width: 640
  rgb_height: 480
  # Physical camera height above the floor. Used by depth-to-map projection.
  agent_height_m: 1.3
  # Camera pitch/elevation in degrees. Downward tilt is negative.
  camera_pitch_deg: -15.0
  # Use the same D435i horizontal FOV for RGB-D projection on the real robot.
  hfov_deg: 87.0
  depth_hfov_deg: 87.0
  min_depth_m: 0.3
  max_depth_m: 3.0

control:
  forward_step_m: 0.5
  turn_angle_deg: 45.0
  linear_speed_mps: 0.5
  angular_speed_deg_s: 60.0

topics:
  rgb: /camera/camera/color/image_raw
  rgb_camera_info: /camera/camera/color/camera_info
  depth: /camera/camera/depth/image_rect_raw
  depth_camera_info: /camera/camera/depth/camera_info
  imu: /camera/camera/imu
  odom: /odom
  pose: ""
  action_cmd: /spacevln/action_cmd
  action_status: /spacevln/action_status
  capture_request: /spacevln/capture/request
