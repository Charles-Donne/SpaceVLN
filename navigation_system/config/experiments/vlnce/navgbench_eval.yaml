SPACE:
  SENSOR:
    HFOV_DEG: 79.0
    FRAME_WIDTH: 640
    FRAME_HEIGHT: 480
    AGENT_HEIGHT_M: 0.88
  MAP:
    OBSTACLE_MIN_HEIGHT_CM: 15
    OBSTACLE_MAX_HEIGHT_CM: 130
    EXPLORED_RAY_FILL: true

OUTPUT:
  REQUESTS:
    SAVE_VLM_ARTIFACTS: true
  MAPS:
    SAVE_STEP_ARTIFACTS: false
  REPLAY:
    SAVE_STEP_IMAGES: true
    SAVE_GIF: false
    CLEANUP_STEP_IMAGES_AFTER_GIF: true
  LOGS:
    SAVE_EPISODE_STDOUT: false
  STATE:
    SAVE_WAYPOINT_MEMORY: false

CONTROL:
  RECOVERY:
    ENABLE_AUTO_RETREAT: false
    STOP_EARLY_IF_REVERSE_BLOCKED: false
    ACTION_STAGNATION_REPLAN_STREAK: 3
  STOPPING:
    ENABLE_FINAL_DESTINATION_MATCH_AUTOSTOP: false
    FINAL_DESTINATION_MATCH_AUTOSTOP_STREAK: 3
    FINAL_DESTINATION_MATCH_AUTOSTOP_RADIUS_M: 1.0

EVAL:
  SPLIT: navgbench
  USE_CKPT_CONFIG: false
  EPISODE_COUNT: 1000
  SAVE_RESULTS: true
  SUCCESS_DISTANCE_M: 3.0

TASK_CONFIG:
  ENVIRONMENT:
    MAX_EPISODE_STEPS: 500
  SIMULATOR:
    FORWARD_STEP_SIZE: 0.25
    TURN_ANGLE: 30
    AGENT_0:
      SENSORS: [RGB_SENSOR, DEPTH_SENSOR]
      HEIGHT: 0.88
      RADIUS: 0.1
    RGB_SENSOR:
      WIDTH: 640
      HEIGHT: 480
      HFOV: 79
      POSITION: [0, 0.88, 0]
    DEPTH_SENSOR:
      WIDTH: 640
      HEIGHT: 480
      HFOV: 79
      MIN_DEPTH: 0.5
      MAX_DEPTH: 5.0
      POSITION: [0, 0.88, 0]
