# SpaceVLN local model pricing table.
#
# Prices are per 1M tokens. Keep this file local/configurable because vendor
# pricing changes over time. A model entry may override the top-level currency.
#
# Sources checked: Alibaba Cloud Model Studio China-mainland pricing and
# Context Cache docs, 2026-05-18; Xiaomi MiMo official pricing and Token Plan
# docs, 2026-05-15.
currency: CNY
unit: per_1m_tokens
last_checked: "2026-05-18"
sources:
  model_pricing: "https://help.aliyun.com/zh/model-studio/model-pricing"
  context_cache: "https://help.aliyun.com/zh/model-studio/context-cache"
  mimo_pricing: "https://platform.xiaomimimo.com/static/docs/pricing.md"
  mimo_token_plan: "https://platform.xiaomimimo.com/static/docs/tokenplan/subscription.md"

cache:
  explicit:
    read_input_multiplier: 0.10
    write_input_multiplier: 1.25
  implicit:
    read_input_multiplier: 0.20
    write_input_multiplier: 1.00

models:
  dashscope:
    # These DashScope entries use the official China mainland / Beijing-region
    # prices because vlm_api_config.yaml points at dashscope.aliyuncs.com.
    # International and EU endpoints publish different prices.
    qwen3.5-122b-a10b:
      aliases:
        - qwen3.5-122b-a10b
        - qwen3.5-122B-A10B
      tiers:
        - max_input_tokens: 131072
          input: 0.8
          output: 6.4
        - max_input_tokens: 262144
          input: 2.0
          output: 16.0
    qwen3.5-35b-a3b:
      aliases:
        - qwen3.5-35b-a3b
        - qwen3.5-35B-A3B
      tiers:
