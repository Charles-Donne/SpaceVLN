# SpaceVLN local model pricing table.
#
# Prices are per 1M tokens. Keep this file local/configurable because vendor
# pricing changes over time. A model entry may override the top-level currency.
#
# Source checked: Alibaba Cloud Model Studio China pricing docs, 2026-05-13.
currency: CNY
unit: per_1m_tokens
last_checked: "2026-05-13"
sources:
  model_pricing: "https://help.aliyun.com/zh/model-studio/models"
  context_cache: "https://help.aliyun.com/zh/model-studio/context-cache"

cache:
  explicit:
    read_input_multiplier: 0.10
    write_input_multiplier: 1.25
  implicit:
    read_input_multiplier: 0.20
    write_input_multiplier: 1.00

models:
  dashscope:
    qwen3.5-plus:
      aliases:
        - qwen3.5-plus-2026-02-15
        - qwen3.5-plus-2026-04-20
