# ======================================================
# SpaceVLN Qwen 显式上下文缓存配置
# ======================================================
#
# 这份配置供 `vlm_navigation_qwen_cache.py` / `run_r2r/vlm_navigation_qwen_cache.sh` 使用。
# 它不会替换原来的 `vlm_api_config.yaml`。
#
# 设计目标：
#   - DashScope 直连
#   - qwen3.5-plus 做规划
#   - qwen3.5-flash 做动作
#   - 关闭 thinking
#   - 强制走 chat/completions，启用显式 context cache
#
# ======================================================

provider: "dashscope"

dashscope:
  api_key: "sk-f2e9d3aa21a640ff9141d91c43b7f6aa"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  wire_api: "chat_completions"
  llm_model: "qwen3.5-plus"
  vlm_model: "qwen3.5-flash"

temperature: 0.1

# 规划器
llm_max_tokens: 2000
llm_timeout: 35

# 动作执行器
vlm_max_tokens: 500
vlm_timeout: 5

qwen_context_cache:
  enabled: true
  cache_type: "ephemeral"
  print_usage: false
  results_dir_suffix: "_cache"
