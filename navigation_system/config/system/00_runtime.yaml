TASK:
  BASE_TASK_CONFIG_PATH: habitat_extensions/config/spacevln_task.yaml
  SENSORS: ["RGB_SENSOR", "DEPTH_SENSOR"]

RUNTIME:
  SIMULATOR_GPU_IDS: [0]
  TORCH_GPU_ID: 0
  NUM_ENVIRONMENTS: 1

PATHS:
  # Unified default path policy:
  #   keep RESULTS_ROOT empty and always resolve to workspace-level
  #   ../result relative to SpaceVLN, i.e. nav_ws/result
  # If storage needs to be moved to another disk, keep this empty and
  # create a symlink at nav_ws/result pointing to an absolute target path.
  # Runtime appends:
  #   normal:   vlnce/<model-dir>
  #   ablation: vlnce/ablation/<preset>/<model-dir>
  RESULTS_ROOT: ""
  RESULTS_DIR: "" 

CONTROL:
  GEOMETRIC_WAYPOINT:
    ENABLE: false
    MAX_CANDIDATES: 5
    MIN_DISTANCE_M: 0.8
    MAX_DISTANCE_M: 4.0
    STRIDE_M: 0.75
    OBSTACLE_INFLATION_RADIUS_M: 0.30
    UNKNOWN_AS_OBSTACLE: true
    MIN_CLEARANCE_M: 0.20
    PATH_STEP_M: 0.35
    ARRIVAL_RADIUS_M: 0.35
    MAX_PATH_EXECUTE_STEPS: 12
    STOP_ON_BLOCKED_FRONT: true
