name: no-landmark-no-space-structure
description: "Remove both landmark detection inputs/renders and space-structure inputs/renders."

thinking_prompt:
  include_detected_landmarks: false
  include_waypoint_summary: false
  include_previous_subtask_landmark_summary: false
  include_verify_notice: true

action_prompt:
  include_progress_summary: true
  include_previous_action_reason: false
  include_detected_landmarks: false
  include_obstacle_summary: true
  include_landmark_map_info: false

thinking_image:
  include_detection_boxes: false
  include_obstacle_text: true
  include_landmark_strip: false
  include_space_waypoint_strip: false
  include_last_visited_marker: false
  include_global_map_space_structure: false

action_image:
  use_detection_overlay: false
